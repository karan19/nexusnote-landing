<script>

/* ================= utils ================= */
const TAU=Math.PI*2;
const lerp=(a,b,k)=>a+(b-a)*k;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const easeIO=k=>{k=clamp(k,0,1);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;};
const sstep=k=>{k=clamp(k,0,1);return k*k*(3-2*k);};
const fract=v=>v-Math.floor(v);
const hash=(n,s)=>fract(Math.sin(n*127.1+s*311.7)*43758.5453);
const P2=(x1,y1,x2,y2,k)=>({x:lerp(x1,x2,k),y:lerp(y1,y2,k)});

/* ================= world constants ================= */
const INK='#1b1b1b', FAR='#a8a8a4', FAINT='#e6e6e3', PEDGE='#d9d9d6', MUT='#6f6f6c';
const GY=600;                 // ground line (world y)

  {name:'NOTES',label:'Notes',x0:896,x1:965},
  {name:'PROJECTS',label:'Projects',x0:965,x1:1035},
  {name:'THOUGHTS',label:'Thoughts',x0:1035,x1:1104}

/* triangle edges (board space): drawn as extensions of the paper marks.

const TRI_A={x:1000,y:300}, TRI_B={x:930,y:420}, TRI_C={x:1070,y:420};

];

function paperDesk(u,v){ // bilinear map of paper-local (u,v) to world
  const t=P2(PAPER_Q.tl.x,PAPER_Q.tl.y,PAPER_Q.tr.x,PAPER_Q.tr.y,u);
  const b=P2(PAPER_Q.bl.x,PAPER_Q.bl.y,PAPER_Q.br.x,PAPER_Q.br.y,u);
  return {x:lerp(t.x,b.x,v), y:lerp(t.y,b.y,v)};
}

/* ================= mocap rig: Xbot joints -> 2D ink =================
   The character is driven by real Xbot motion-capture joint positions
   (baked to joints-data.js). We sample the 3D joints, blend phase
   transitions in 3D (pre-projection, so facing flips don't smear),
   project to a 2D side view with a slight depth offset, then draw the
   ink figure around the skeleton. A tiny 2-bone IK assist guarantees
   the pinning hand lands exactly on its slot. */
const JD = JOINT_DATA.meta;
/* the bake's strideM (0.887) was root-based, but the Xbot walk is in-place:
   the true foot stance excursion is 0.81m -- use that so feet plant */
JD.cal.strideM = 0.81;
const MS = 120;            // px per meter
const DEPTH_K = 24;        // px per meter of bind-x (depth cue in the side view)
const _jraw = Uint8Array.from(atob(JOINT_DATA.pos), c => c.charCodeAt(0));
const _jq = new Int16Array(_jraw.buffer);
const JNS = JD.samples, JNQ = JD.joints.length;
const JARR = new Float32Array(JNS * JNQ * 3);
for (let i = 0; i < JARR.length; i++) JARR[i] = _jq[i] / 32767 * 4;
const _jidx = {};
JD.joints.forEach((n, i) => _jidx[n] = i);
function j3(name, s) {
  const j = _jidx[name];
  const sf = clamp(s, 0, JNS - 1), s0 = Math.floor(sf), f = sf - s0, s1 = Math.min(JNS - 1, s0 + 1);
  const o0 = (s0 * JNQ + j) * 3, o1 = (s1 * JNQ + j) * 3;
  return [JARR[o0] + (JARR[o1] - JARR[o0]) * f,
          JARR[o0+1] + (JARR[o1+1] - JARR[o0+1]) * f,
          JARR[o0+2] + (JARR[o1+2] - JARR[o0+2]) * f];
}

/* calibration from the bake */
const WH = JD.cal.writeHand;                 // hand rel hips during write (meters)
const SIT_HIPS_Y = JD.cal.sitHipsY;
const PH = JD.cal.postHand;                  // hand rel hips during post
const PAPER_CX = 323;
const WRITE_X = PAPER_CX - (WH[2] * MS + WH[0] * DEPTH_K); // root x: writing hand on paper
const PAPER_SY = GY - (SIT_HIPS_Y + WH[1]) * MS;           // paper surface y
const REACH_FWD = 0.32;                      // hand forward of root at pin (WALL_X-ROOT_WALL)
const PINX = SLOTS.map(s => s.x - (REACH_FWD * MS + PH[0] * DEPTH_K));

/* desk paper: a parallelogram so (u,v) <-> world inverts exactly */
const PAPER_Q = {
  tl: {x: PAPER_CX-57, y: PAPER_SY-19}, tr: {x: PAPER_CX+57, y: PAPER_SY-19},
  bl: {x: PAPER_CX-73, y: PAPER_SY+19}, br: {x: PAPER_CX+41, y: PAPER_SY+19}
};
function paperUV(x, y){
  const ax=114, ay=0, bx=-16, by=38;
  const dx=x-PAPER_Q.tl.x, dy=y-PAPER_Q.tl.y, det=ax*by-ay*bx;
  return {u:(dx*by-dy*bx)/det, v:(ax*dy-ay*dx)/det};
}

function mocapRange(cyc, k){
  const key = k + cyc, r = RANGES[key];
  return [r.a, r.b];
}
/* exact per-(cycle,phase) sample windows, replicated from the bake's phaseAt */
function bakePhaseAt(t){
  const CYC = JD.cyc, START = JD.start, FR = JD.fr;
  for (let i = 0; i < 4; i++){
    const c0 = START + i * CYC, c1 = c0 + CYC;
    if (t >= c0 && t < c1){
      const u = (t - c0) / CYC;
      for (const k in FR) if (u >= FR[k][0] && u < FR[k][1]) return {k: k, i: i};
    }
  }
  if (t < START) return {k: 'write', i: 0};
  if (t < 0.925) return {k: 'standFinal'};
  return {k: 'idleFinal'};
}
const RANGES = {};
for (let s = 0; s < JNS; s++){
  const ph = bakePhaseAt(s / (JNS - 1));
  const key = ph.k + (ph.i !== undefined ? ph.i : '');
  if (!RANGES[key]) RANGES[key] = {a: s, b: s};
  else { RANGES[key].a = Math.min(RANGES[key].a, s); RANGES[key].b = Math.max(RANGES[key].b, s); }
}
RANGES.standFinal = RANGES.standFinal || {a: 281, b: 295};
RANGES.idleFinal = RANGES.idleFinal || {a: 296, b: 319};
const SF_A = 0.88 * (JNS - 1), SF_B = 0.925 * (JNS - 1);
const IF_A = 0.925 * (JNS - 1), IF_B = JNS - 1;

/* write clock that freezes during the pause beat ((t%23)>21) */
function writeTime(t){
  const c = Math.floor(t / 23), r = t - c * 23;
  return t - (c * 2 + Math.max(0, r - 21));
}
function tri01(p){ p = p % 2; if (p < 0) p += 2; return p < 1 ? p : 2 - p; }

function sampleJoints(seg, cyc, k, t){
  const J = {};
  let s = 0, rootX = WRITE_X, f = 1;
  if (seg === 'write' || seg === 'finaleWrite'){
    const r = mocapRange(cyc, 'write');
    s = r[0] + (r[1] - r[0]) * tri01(writeTime(t) / 1.5);
  } else if (seg === 'stand'){
    const r = mocapRange(cyc, 'stand');
    s = r[0] + (r[1] - r[0]) * k;
  } else if (seg === 'walkOut' || seg === 'walkBack'){
    const isOut = seg === 'walkOut';
    const x0 = isOut ? WRITE_X : PINX[cyc], x1 = isOut ? PINX[cyc] : WRITE_X;
    const distM = Math.abs(x1 - x0) * k / MS;
    const sps = JD.cal.walkPeriod / 2;                 // samples per stride
    const sAdv = (distM / JD.cal.strideM) * sps;
    const start = isOut ? JD.cal.walkLoopStart : JD.cal.walkBackLoopStart;
    s = start + (sAdv % JD.cal.walkPeriod);
    rootX = lerp(x0, x1, k); f = isOut ? 1 : -1;
  } else if (seg === 'pin'){
    const r = mocapRange(cyc, 'post');
    s = r[0] + (r[1] - r[0]) * Math.min(1, k / 0.55);
    rootX = PINX[cyc];
  } else if (seg === 'sit'){
    const r = mocapRange(cyc, 'sitDown');
    s = r[0] + (r[1] - r[0]) * k;
  } else if (seg === 'finaleStand'){
    s = SF_A + (SF_B - SF_A) * k;
  } else if (seg === 'finaleIdle'){
    s = IF_A + ((t * 8) % (IF_B - IF_A));
  }
  for (const n of JD.joints) J[n] = j3(n, s);
  return {J: J, rootX: rootX, f: f};
}

const BLEND = 0.16;   // phase-transition blend (fraction of the incoming phase)
function prevSegFor(id, cyc){
  switch(id){
    case 'stand': return ['write', cyc];
    case 'walkOut': return ['stand', cyc];
    case 'pin': return ['walkOut', cyc];
    case 'walkBack': return ['pin', cyc];
    case 'sit': return ['walkBack', cyc];
    case 'write': return cyc > 0 ? ['sit', cyc - 1] : null;
    case 'finale': return ['sit', 3];
  }
  return null;
}
function blendJ3(dst, src, b){
  for (const n of JD.joints){
    const a = src[n], c = dst[n];
    c[0] = a[0] + (c[0] - a[0]) * b;
    c[1] = a[1] + (c[1] - a[1]) * b;
    c[2] = a[2] + (c[2] - a[2]) * b;
  }
}

/* 2D two-bone IK, in place: puts ha exactly on (tx,ty) */
function ik2(sh, el, ha, tx, ty){
  const l1 = Math.hypot(el.x - sh.x, el.y - sh.y);
  const l2 = Math.hypot(ha.x - el.x, ha.y - el.y);
  let dx = tx - sh.x, dy = ty - sh.y, d = Math.hypot(dx, dy);
  const maxD = l1 + l2 - 1, minD = Math.abs(l1 - l2) + 1;
  if (d > maxD){ dx *= maxD / d; dy *= maxD / d; d = maxD; }
  if (d < minD){ const s = minD / Math.max(d, 0.01); dx *= s; dy *= s; d = minD; }
  const a = Math.atan2(dy, dx);
  const cosEl = clamp((l1*l1 + d*d - l2*l2) / (2*l1*d), -1, 1);
  const curA = Math.atan2(el.y - sh.y, el.x - sh.x);
  let ds = curA - a;
  while (ds > Math.PI) ds -= TAU; while (ds < -Math.PI) ds += TAU;
  const ea = a + (ds >= 0 ? Math.acos(cosEl) : -Math.acos(cosEl));
  el.x = sh.x + Math.cos(ea) * l1; el.y = sh.y + Math.sin(ea) * l1;
  ha.x = sh.x + dx; ha.y = sh.y + dy;
}

function gazeFor(st, paused){
  const f = st.id === 'walkBack' ? -1 : 1;
  if (st.id === 'write' || (st.id === 'finale' && st.k < 0.55))
    return paused ? {x: 0.5*f, y: -0.2} : {x: 0.45*f, y: 0.85};
  if (st.id === 'pin') return {x: 0.75, y: -0.55};
  if (st.id === 'walkOut') return {x: 0.85, y: 0};
  if (st.id === 'walkBack') return {x: -0.85, y: 0};
  if (st.id === 'stand' || st.id === 'sit') return {x: 0.6*f, y: 0.1};
  if (st.id === 'finale') return {x: 0.85, y: -0.30};
  return {x: 0.7*f, y: 0.1};
}

function computePose(st, t){
  let cur, prv = null, bk = 0;
  if (st.id === 'finale'){
    if (st.k < 0.55){
      cur = sampleJoints('finaleWrite', 3, st.k, t);
    } else if (st.k < 0.70){
      cur = sampleJoints('finaleStand', 3, (st.k - 0.55) / 0.15, t);
      if (st.k < 0.55 + BLEND){ prv = sampleJoints('finaleWrite', 3, 0, t); bk = (st.k - 0.55) / BLEND; }
    } else {
      cur = sampleJoints('finaleIdle', 3, st.k, t);
      if (st.k < 0.70 + BLEND){ prv = sampleJoints('finaleStand', 3, 1, t); bk = (st.k - 0.70) / BLEND; }
    }
  } else {
    cur = sampleJoints(st.id, st.cyc, st.k, t);
    if (st.k < BLEND){
      const ps = prevSegFor(st.id, st.cyc);
      if (ps){ prv = sampleJoints(ps[0], ps[1], 1, t); bk = st.k / BLEND; }
    }
  }
  if (prv){
    const b = easeIO(bk);
    blendJ3(cur.J, prv.J, b);
    cur.rootX = lerp(prv.rootX, cur.rootX, b);
    cur.f = lerp(prv.f, cur.f, b);   // turn through edge-on, don't mirror-pop
  }
  /* project to the 2D side view */
  const P = {};
  for (const n of JD.joints){
    const j = cur.J[n];
    P[n] = {x: cur.rootX + cur.f * j[2] * MS + j[0] * DEPTH_K, y: GY - j[1] * MS};
  }
  const hx = P.head.x - P.neck.x, hy = P.head.y - P.neck.y, hd = Math.hypot(hx, hy) || 1;
  const sk = {
    f: cur.f,
    pelvis: P.hips, chest: P.chest, neck: P.neck,
    head: {x: P.head.x + hx / hd * 13, y: P.head.y + hy / hd * 13},
    shR: P.shR, elR: P.elR, haR: P.haR,
    shL: P.shL, elL: P.elL, haL: P.haL,
    hipR: P.hipR, kneeR: P.kneeR, footR: P.footR, toeR: P.toeR,
    hipL: P.hipL, kneeL: P.kneeL, footL: P.footL, toeL: P.toeL,
    blink: (t % 3.7) < 0.12
  };
  const paused = (st.id === 'write' || (st.id === 'finale' && st.k < 0.55)) && (t % 23) > 21;
  sk.gaze = gazeFor(st, paused);
  const writing = (st.id === 'write' || (st.id === 'finale' && st.k < 0.55)) && !paused;
  if (writing){
    /* draw this paper's mark: pen traces predetermined UV segment(s).
       index by papers already pinned (write runs a half-cycle ahead of st.cyc) */
    const li = Math.min(pinned.length, PAPER_LINES.length-1);
    const segs = PAPER_LINES[li] || PAPER_LINES[0];
    const ft = clamp(st.k,0,1) * segs.length;
    const si = Math.min(segs.length-1, Math.floor(ft));
    const lt = ft - si;
    const sg = segs[si];
    const u = lerp(sg[0][0], sg[1][0], lt), v = lerp(sg[0][1], sg[1][1], lt);
    const w = paperDesk(u, v);
    sk.haR.x = w.x; sk.haR.y = w.y;
    sk.penTip = {x: w.x, y: w.y + 3};
    sk.penDown = true;
    sk._uv = {u, v};
  } else { sk.penTip = null; sk.penDown = false; sk._uv = null; }
  /* pin IK assist: the mocap already lands within a pixel; this nails it */
  if (st.id === 'pin' && st.k > 0.30){
    const sl = SLOTS[st.cyc];
    ik2(sk.shR, sk.elR, sk.haR, sl.x, sl.y - 10);
  }
  return sk;
}


/* ================= timeline ================= */
const SEGS=[{id:'write',dur:1.0}];
for(let c=0;c<4;c++){
  SEGS.push({id:'stand',dur:0.5,cyc:c});
  SEGS.push({id:'walkOut',dur:1.1,cyc:c});
  SEGS.push({id:'pin',dur:0.6,cyc:c});
  SEGS.push({id:'walkBack',dur:1.1,cyc:c});
  SEGS.push({id:'sit',dur:0.5,cyc:c});
  SEGS.push({id:'write',dur:0.8,cyc:c});
}
SEGS.push({id:'finale',dur:2.4});
const TOTAL=SEGS.reduce((a,g)=>a+g.dur,0);
function timelineAt(sc){
  let acc=0;
  const last=SEGS[SEGS.length-1];
  for(const g of SEGS){
    const d=g.dur/TOTAL;
    if(sc<acc+d||g===last) return {id:g.id,k:clamp((sc-acc)/d,0,1),cyc:g.cyc||0};
    acc+=d;
  }
  return {id:'finale',k:1,cyc:0};
}

/* ================= papers & notes ================= */
let paper=null;      // current sheet: {trail:[[u,v]], mode, fade, done}
let pinned=[];       // pinned notes: {slot:{x,y}, trail}
function updatePapers(st,t,sk){
  if(st.id==='write'||st.id==='finale'||st.id==='sit'){
    if(!paper) paper={trail:[],mode:'desk',fade:0};
    paper.mode='desk';
    paper.fade=Math.min(1,(paper.fade||0)+0.05);
    if(sk&&sk._uv){
      const uv=sk._uv;
      const last=paper.trail[paper.trail.length-1];
      if(!last||Math.hypot(uv.u-last[0],uv.v-last[1])>0.004){
        paper.trail.push([clamp(uv.u,0.02,0.98),clamp(uv.v,0.02,0.98)]);
        if(paper.trail.length>600) paper.trail.shift();
      }
    }
  } else if(st.id==='stand'){ if(paper) paper.mode='carry';
  } else if(st.id==='walkOut'){ if(paper) paper.mode='hand';
  } else if(st.id==='pin'){
    if(paper){
      paper.mode='toboard'; paper.cyc=st.cyc;
      if(st.k>0.6&&!paper.done){ paper.done=true; pinned.push({slot:SLOTS[st.cyc],trail:paper.trail.slice()}); }
    }
  } else if(st.id==='walkBack'){
    /* fallback: a fast fling can skip the pin moment entirely — never lose the note */
    if(paper&&!paper.done){
      paper.done=true;
      pinned.push({slot:SLOTS[paper.cyc!==undefined?paper.cyc:st.cyc],trail:paper.trail.slice()});
    }
    paper=null;
  }
}

/* ================= camera ================= */
function cameraFor(st){
  switch(st.id){
    case 'write': case 'stand': case 'sit': return {cx:335,cy:420,viewW:780};
    case 'walkOut':  return {cx:lerp(335,1000,sstep(st.k)),cy:420,viewW:1050};
    case 'pin':      return {cx:1000,cy:410,viewW:920};
    case 'walkBack': return {cx:lerp(1000,335,sstep(st.k)),cy:420,viewW:1050};
    case 'finale':   return {cx:640,cy:415,viewW:1340};
  }
  return {cx:335,cy:420,viewW:780};
}

/* ================= rendering ================= */
let canvas=null, ctx=null;
let vw=1280, vh=760, dpr=1;
let capEl=null, progEl=null, headEl=null, hintEl=null;
const view={cx:335,cy:420,z:1};
let sCur=0, lastCap='';

/* world -> screen with hand-drawn "boil" */
let boilT=0;
function S(x,y,seed,smooth){
  const sx=(x-view.cx)*view.z+vw/2, sy=(y-view.cy)*view.z+vh/2;
  if(smooth) return [sx,sy];
  const q=Math.floor(boilT*9);
  return [sx+(hash(q,seed)-0.5)*3.2, sy+(hash(q,seed+57)-0.5)*3.2];
}
function strokePts(pts,w,color,seed,smooth){
  ctx.strokeStyle=color; ctx.lineWidth=Math.max(1,w*view.z); ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){ const q=S(pts[i].x,pts[i].y,seed+i*13,smooth); if(i)ctx.lineTo(q[0],q[1]); else ctx.moveTo(q[0],q[1]); }
  ctx.stroke();
}
function dot(x,y,r,color,seed){
  const q=S(x,y,seed);
  ctx.fillStyle=color; ctx.beginPath(); ctx.arc(q[0],q[1],Math.max(0.5,r*view.z),0,TAU); ctx.fill();
}

function drawSet(fx){
  /* floor */
  strokePts([{x:60,y:GY},{x:1220,y:GY}],2.5,INK,101);
  /* board */
  (function(){
    const a=S(BOARD.x0,BOARD.y0,102), b=S(BOARD.x1,BOARD.y1,103);
    ctx.strokeStyle=INK; ctx.lineWidth=4*Math.min(1.2,view.z);
    ctx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
    /* section dividers */
    ctx.strokeStyle=PEDGE; ctx.lineWidth=1.5;
    for(const s of SECTIONS){
      if(s.x0===BOARD.x0) continue;
      const d1=S(s.x0,282,160+s.x0), d2=S(s.x0,520,161+s.x0);
      ctx.beginPath(); ctx.moveTo(d1[0],d1[1]); ctx.lineTo(d2[0],d2[1]); ctx.stroke();
    }
    /* section labels (hidden when they'd render too small, e.g. phones) */
    const fsPx=Math.round(12*view.z);
    if(fsPx>=8){
      ctx.fillStyle=MUT; ctx.textAlign='center';
      ctx.font='600 '+fsPx+'px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
      for(const s of SECTIONS){
        const q=S((s.x0+s.x1)/2,262,170+s.x0);
        ctx.fillText(s.name,q[0],q[1]);
      }
      ctx.textAlign='left';
    }
  })();
  /* pinned notes */
  drawThreads(fx);
  /* yellow fill once the triangle is complete */
  if(triProg[0]>=1&&triProg[1]>=1&&triProg[2]>=1&&triFillK<1) triFillK=Math.min(1,triFillK+0.03);
  if(triFillK>0){
    const fA=S(TRI_A.x,TRI_A.y,150), fB=S(TRI_B.x,TRI_B.y,150), fC=S(TRI_C.x,TRI_C.y,150);
    ctx.save(); ctx.globalAlpha=triFillK*0.9; ctx.fillStyle='#FFD54D';
    ctx.beginPath(); ctx.moveTo(fA[0],fA[1]); ctx.lineTo(fB[0],fB[1]); ctx.lineTo(fC[0],fC[1]); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  for(const n of pinned) drawNoteRect(n.slot.x,n.slot.y,64,84,0,n.trail,1,true);
  /* triangle edges: extend the paper lines so the triangle actually forms */
  for(let i=0;i<TRI_EDGES.length;i++){
    const e=TRI_EDGES[i];
    if(pinned.length>=e.after && triProg[i]<1) triProg[i]=Math.min(1,triProg[i]+0.04);
    if(triProg[i]>0){
      const q1=S(e.x1,e.y1,150), q2=S(e.x2,e.y2,150);
      const px=lerp(q1[0],q2[0],triProg[i]), py=lerp(q1[1],q2[1],triProg[i]);
      ctx.strokeStyle='#D99E00'; ctx.lineWidth=5; ctx.beginPath();
      ctx.moveTo(q1[0],q1[1]); ctx.lineTo(px,py); ctx.stroke();
    }
  }
  /* desk */
  strokePts([{x:200,y:524},{x:200,y:GY}],5,INK,104);
  strokePts([{x:400,y:524},{x:400,y:GY}],5,INK,105);
  strokePts([{x:180,y:524},{x:420,y:524}],6,INK,106);
  /* inkwell */
  (function(){
    const q=S(400,510,107), w=13*view.z, h=14*view.z;
    ctx.fillStyle=INK; ctx.fillRect(q[0]-w/2,q[1]-h/2,w,h);
  })();
  /* chair */
  strokePts([{x:238,y:527},{x:238,y:449}],5,INK,108);
  strokePts([{x:238,y:527},{x:318,y:527}],5,INK,109);
  strokePts([{x:252,y:527},{x:252,y:GY}],4,INK,110);
  strokePts([{x:304,y:527},{x:304,y:GY}],4,INK,111);
}

function drawDeskPaper(alpha){
  const c=[PAPER_Q.tl,PAPER_Q.tr,PAPER_Q.br,PAPER_Q.bl].map((p,i)=>S(p.x,p.y,120+i));
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.moveTo(c[0][0],c[0][1]);
  for(let i=1;i<4;i++) ctx.lineTo(c[i][0],c[i][1]);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=PEDGE; ctx.lineWidth=1.5; ctx.stroke();
  /* ruled lines */
  ctx.strokeStyle=FAINT; ctx.lineWidth=1;
  for(const v of [0.3,0.55,0.8]){
    const a=paperDesk(0.08,v), b=paperDesk(0.92,v);
    const qa=S(a.x,a.y,130+v*10), qb=S(b.x,b.y,131+v*10);
    ctx.beginPath(); ctx.moveTo(qa[0],qa[1]); ctx.lineTo(qb[0],qb[1]); ctx.stroke();
  }
  /* ink trail */
  if(paper&&paper.trail.length>1){
    ctx.strokeStyle=INK; ctx.lineWidth=2.4; ctx.beginPath();
    for(let i=0;i<paper.trail.length;i++){
      const w=paperDesk(paper.trail[i][0],paper.trail[i][1]);
      const q=S(w.x,w.y,140);
      if(i)ctx.lineTo(q[0],q[1]); else ctx.moveTo(q[0],q[1]);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawNoteRect(cx,cy,w,h,rot,trail,alpha,pin){
  ctx.save(); ctx.globalAlpha=alpha;
  const q=S(cx,cy,150);
  ctx.translate(q[0],q[1]); ctx.rotate(rot);
  const W=w*view.z, H=h*view.z;
  ctx.fillStyle='#ffffff'; ctx.strokeStyle=PEDGE; ctx.lineWidth=1.5;
  ctx.fillRect(-W/2,-H/2,W,H); ctx.strokeRect(-W/2,-H/2,W,H);
  if(trail&&trail.length>1){
    ctx.strokeStyle=INK; ctx.lineWidth=4; ctx.beginPath();
    for(let i=0;i<trail.length;i++){
      const x=(trail[i][0]-0.5)*W*0.92, y=(trail[i][1]-0.5)*H*0.9;
      if(i)ctx.lineTo(x,y); else ctx.moveTo(x,y);
    }
    ctx.stroke();
  }
  if(pin){ ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(0,-H/2+7*view.z,3.6*view.z,0,TAU); ctx.fill(); }
  ctx.restore();
}

/* tapered ink limb: filled quad, wide at p0, narrow at p1, round ends */
function limb(p0,p1,w0,w1,color,seed){
  const dx=p1.x-p0.x, dy=p1.y-p0.y, d=Math.hypot(dx,dy)||1;
  const nx=-dy/d, ny=dx/d;
  const a=S(p0.x+nx*w0/2,p0.y+ny*w0/2,seed),   b=S(p0.x-nx*w0/2,p0.y-ny*w0/2,seed+1);
  const c=S(p1.x-nx*w1/2,p1.y-ny*w1/2,seed+2), e=S(p1.x+nx*w1/2,p1.y+ny*w1/2,seed+3);
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(a[0],a[1]); ctx.lineTo(e[0],e[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(b[0],b[1]);
  ctx.closePath(); ctx.fill();
  dot(p0.x,p0.y,w0/2,color,seed+4); dot(p1.x,p1.y,w1/2,color,seed+5);
}
function shoe(ankle,toe,color,seed){
  limb(ankle,toe,9,6.5,color,seed);
  dot(ankle.x,ankle.y,5,color,seed+6);
}
function hand(wrist,color,seed,f){
  dot(wrist.x,wrist.y,5.5,color,seed);
  strokePts([{x:wrist.x+1*f,y:wrist.y+2},{x:wrist.x+7*f,y:wrist.y+6}],3,color,seed+1);
}
function drawHead(s){
  const q=S(s.head.x,s.head.y,63), r=17*view.z, f=s.f;
  ctx.fillStyle='#fbfbfa';
  ctx.beginPath(); ctx.arc(q[0],q[1],r,0,TAU); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.stroke();
  /* hair: swept cap over the top */
  ctx.lineWidth=3.5; ctx.beginPath();
  ctx.arc(q[0],q[1],r+1.5,Math.PI*1.02,Math.PI*1.98); ctx.stroke();
  ctx.beginPath();
  ctx.arc(q[0],q[1],r+1.5,Math.PI*(f>0?1.55:1.45),Math.PI*(f>0?1.98:1.02),f<0); ctx.stroke();
  /* ear at the back of the head */
  ctx.lineWidth=2.5; ctx.beginPath();
  ctx.arc(q[0]-11*f*view.z,q[1]+2*view.z,4.5*view.z,0,TAU); ctx.stroke();
  /* nose */
  strokePts([{x:s.head.x+13*f,y:s.head.y+3},{x:s.head.x+16.5*f,y:s.head.y+7}],2.2,INK,64);
  /* eye follows the gaze; blinks shut */
  if(s.blink){
    strokePts([{x:s.head.x+3*f,y:s.head.y-3},{x:s.head.x+9*f,y:s.head.y-3}],2.2,INK,65);
  } else {
    const gx=s.gaze?s.gaze.x*3.5:0, gy=s.gaze?s.gaze.y*3.5:0;
    dot(s.head.x+6*f+gx,s.head.y-3+gy,2.4,INK,66);
  }
}

function drawCharacter(s){
  /* far side */
  limb(s.hipL,s.kneeL,13,10.5,FAR,11); limb(s.kneeL,s.footL,10.5,8,FAR,12);
  shoe(s.footL,s.toeL,FAR,13);
  limb(s.shL,s.elL,10,8,FAR,21); limb(s.elL,s.haL,8,6.5,FAR,22);
  dot(s.haL.x,s.haL.y,5,FAR,23);
  /* torso: tapered pelvis -> chest, with hip mass */
  limb(s.pelvis,s.chest,26,34,INK,31);
  dot(s.pelvis.x,s.pelvis.y,13,INK,32);
  /* near leg + shoe */
  limb(s.hipR,s.kneeR,13,10.5,INK,41); limb(s.kneeR,s.footR,10.5,8,INK,42);
  shoe(s.footR,s.toeR,INK,43);
  /* near arm + hand */
  limb(s.shR,s.elR,10,8,INK,51); limb(s.elR,s.haR,8,6.5,INK,52);
  hand(s.haR,INK,53,s.f);
  /* neck: solid bridge from the torso straight into the head (no white gap) */
  limb(s.chest,s.neck,11,9,INK,61);
  drawHead(s);
  /* pen: a real visible pen held in the writing hand, nib on the paper */
  if(s.penTip){
    const hx=s.haR.x, hy=s.haR.y;
    let dx=s.penTip.x-hx, dy=s.penTip.y-hy;
    const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
    strokePts([{x:hx-dx*17,y:hy-dy*17},{x:s.penTip.x,y:s.penTip.y}],4.5,INK,72);
  }
}

function drawCarriedPaper(st,sk){
  if(!paper) return;
  if(paper.mode==='desk'){ drawDeskPaper(paper.fade); return; }
  let cx,cy,w,h,rot;
  const hx=sk.haR.x+14, hy=sk.haR.y+10;
  if(paper.mode==='carry'){
    const b=easeIO(st.k);
    cx=lerp(PAPER_CX,hx,b); cy=lerp(PAPER_SY,hy,b);
    w=lerp(96,46,b); h=lerp(110,58,b); rot=lerp(0,-0.12,b);
  } else if(paper.mode==='hand'){
    cx=hx; cy=hy; w=46; h=58; rot=-0.12;
  } else if(paper.mode==='toboard'){
    const sl=SLOTS[st.cyc], b=sstep((st.k-0.25)/0.5);
    cx=lerp(hx,sl.x,b); cy=lerp(hy,sl.y,b);
    w=lerp(46,64,b); h=lerp(58,84,b); rot=lerp(-0.12,0,b);
  } else return;
  drawNoteRect(cx,cy,w,h,rot,paper.trail,1,false);
}

/* ================= finale fx ================= */
function finaleFx(st,t){
  if(st.id!=='finale'||pinned.length<4) return null;
  const k=st.k;
  return {threadK:clamp((k-0.18)/0.28,0,1),tagK:clamp((k-0.46)/0.18,0,1),
          sparkK:clamp((k-0.55)/0.15,0,1),bulbK:clamp((k-0.70)/0.30,0,1),t:t};
}
function qbez(a,c,b,u){const v=1-u;return{x:v*v*a.x+2*v*u*c.x+u*u*b.x,y:v*v*a.y+2*v*u*c.y+u*u*b.y};}
/* ink threads drawing themselves between the pinned notes (under the notes) */
function drawThreads(fx){
  if(!fx||fx.threadK<=0) return;
  const n=THREADS.length;
  for(let i=0;i<n;i++){
    const p=clamp(fx.threadK*n-i,0,1); if(p<=0) continue;
    const A=pinned[THREADS[i][0]].slot, B=pinned[THREADS[i][1]].slot;
    const C={x:(A.x+B.x)/2,y:Math.min(A.y,B.y)-THREADS[i][2]};
    const N=36, m=Math.max(1,Math.floor(p*N)), pts=[];
    for(let j=0;j<=m;j++) pts.push(qbez(A,C,B,j/N));
    strokePts(pts,2.5,MUT,200+i*17,true);
  }
}
function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
/* tag chips stamping onto the notes */
function drawTags(fx){
  if(!fx||fx.tagK<=0) return;
  const n=pinned.length;
  for(let i=0;i<n;i++){
    const p=clamp(fx.tagK*n-i,0,1); if(p<=0) continue;
    const sc=1+0.6*Math.max(0,1-p*2.4);
    const note=pinned[i], off=TAG_OFF[i%TAG_OFF.length];
    const q=S(note.slot.x+off.dx,note.slot.y+off.dy,300+i);
    const label=TAGS[i%TAGS.length];
    const fs=Math.round(11*view.z);
    ctx.save(); ctx.translate(q[0],q[1]); ctx.scale(sc,sc);
    ctx.font='600 '+fs+'px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    const wpx=ctx.measureText(label).width+16*view.z, hpx=20*view.z;
    ctx.fillStyle='#fbfbfa'; ctx.strokeStyle=INK; ctx.lineWidth=1.5;
    roundRectPath(-wpx/2,-hpx/2,wpx,hpx,6*view.z); ctx.fill(); ctx.stroke();
    ctx.fillStyle=MUT; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label,0,1);
    ctx.restore();
  }
  ctx.textBaseline='alphabetic';
}
function drawSpark(x,y,r,seed){
  const q=S(x,y,seed), ir=r*0.32;
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=i/8*TAU-Math.PI/2, rr=i%2?ir:r;
    const px=q[0]+Math.cos(a)*rr, py=q[1]+Math.sin(a)*rr;
    if(i)ctx.lineTo(px,py); else ctx.moveTo(px,py);
  }
  ctx.closePath(); ctx.fill();
}
/* amber AI sparks attaching at the connected notes */
function drawSparks(fx){
  if(!fx||fx.sparkK<=0) return;
  ctx.fillStyle=AMBER;
  for(let i=0;i<SPARKS.length;i++){
    const p=clamp(fx.sparkK*SPARKS.length-i,0,1); if(p<=0) continue;
    const tw=0.65+0.35*Math.sin(fx.t*5+i*2.1);
    drawSpark(SPARKS[i].x,SPARKS[i].y,11*view.z*p*tw,320+i);
  }
}
/* line-art bulb above the board: flickers, then lights with a warm glow */
function drawBulb(fx){
  if(!fx||fx.bulbK<=0) return;
  const k=fx.bulbK, lit=k>=0.35;
  const flick=lit?1:(Math.sin(fx.t*47)>0?1:0.12);
  const R=26, q=S(BULB.x,BULB.y,400);
  if(lit){
    const g=ctx.createRadialGradient(q[0],q[1],R*0.4*view.z,q[0],q[1],R*3.4*view.z);
    g.addColorStop(0,'rgba(232,163,61,0.38)'); g.addColorStop(1,'rgba(232,163,61,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(q[0],q[1],R*3.4*view.z,0,TAU); ctx.fill();
    for(let i=0;i<8;i++){
      const a=i/8*TAU+0.3;
      strokePts([{x:BULB.x+Math.cos(a)*38,y:BULB.y+Math.sin(a)*38},
                 {x:BULB.x+Math.cos(a)*50,y:BULB.y+Math.sin(a)*50}],2.5,INK,410+i);
    }
  }
  ctx.save(); ctx.globalAlpha=0.2+0.8*flick;
  ctx.strokeStyle=INK; ctx.lineWidth=4; ctx.beginPath();
  const qq=S(BULB.x,BULB.y,401); ctx.arc(qq[0],qq[1],R*view.z,0,TAU); ctx.stroke();
  strokePts([{x:BULB.x-8,y:BULB.y+10},{x:BULB.x-4,y:BULB.y-2},{x:BULB.x,y:BULB.y+10},
             {x:BULB.x+4,y:BULB.y-2},{x:BULB.x+8,y:BULB.y+10}],2,INK,415);
  for(let i=0;i<3;i++)
    strokePts([{x:BULB.x-12,y:BULB.y+26+i*7},{x:BULB.x+12,y:BULB.y+26+i*7}],2.5,INK,420+i);
  strokePts([{x:BULB.x-12,y:BULB.y+26},{x:BULB.x-12,y:BULB.y+44}],2.5,INK,424);
  strokePts([{x:BULB.x+12,y:BULB.y+26},{x:BULB.x+12,y:BULB.y+44}],2.5,INK,425);
  ctx.restore();
}

/* ================= captions / chrome ================= */
const CAPS={write:'Write it down',stand:'Take it to the wall',walkOut:'Take it to the wall',
            pin:'Pinned',walkBack:'Back to it',sit:'Back to it',finale:''};
function updateChrome(st,sCur,scrollY){
  let cap=CAPS[st.id]||'';
  if(st.id==='pin') cap='Pinned to '+SECTIONS[SLOTS[st.cyc].sec].label;
  if(st.id==='finale'){
    const k=st.k;
    cap=k<0.18?'':(k<0.46?'Connections appear':(k<0.70?'Tagged and marked':''));
    const h1=headEl.querySelector('h1'), hp=headEl.querySelector('p');
    if(k>0.70){ h1.textContent='Connect your notes.'; hp.textContent='Make something new.'; }
    else { h1.textContent='NexusNote'; hp.textContent='Every note, exactly where you left it.'; }
  }
  if(cap!==lastCap){
    lastCap=cap;
    capEl.textContent=cap;
    capEl.classList.toggle('show',!!cap);
  }
  headEl.classList.toggle('show',st.id==='finale'&&st.k>0.3);
  progEl.style.transform='scaleX('+sCur.toFixed(4)+')';
  hintEl.classList.toggle('hide',scrollY>60);
}

/* ================= main frame ================= */
function frame(scrollY,ms){
  const t=ms/1000;
  boilT=t;
  const max=Math.max(1,document.documentElement.scrollHeight-vh);
  const target=clamp(scrollY/max,0,1);
  sCur+=(target-sCur)*0.09;
  if(Math.abs(target-sCur)<0.0004) sCur=target;
  const st=timelineAt(sCur);
  const sk=computePose(st,t);
  updatePapers(st,t,sk);
  const fx=finaleFx(st,t);
  const cam=cameraFor(st);
  const zt=Math.min(vw/cam.viewW, vh/700);
  view.cx+=(cam.cx-view.cx)*0.07;
  view.cy+=(cam.cy-view.cy)*0.07;
  view.z+=(zt-view.z)*0.07;
  ctx.clearRect(0,0,vw,vh);
  drawSet(fx);
  drawCarriedPaper(st,sk);
  drawCharacter(sk);
  drawTags(fx);
  drawSparks(fx);
  drawBulb(fx);
  updateChrome(st,sCur,scrollY);
}

function resize(){
  vw=window.innerWidth; vh=window.innerHeight;
  dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(vw*dpr); canvas.height=Math.round(vh*dpr);
  canvas.style.width=vw+'px'; canvas.style.height=vh+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function renderStatic(){
  /* reduced-motion: one composed frame */
  resize();
  boilT=0; sCur=0.32;
  view.cx=640; view.cy=415; view.z=Math.min(vw/1340,vh/700);
  pinned=[{slot:SLOTS[0],trail:[[0.2,0.3],[0.5,0.32],[0.8,0.3]]},
          {slot:SLOTS[1],trail:[[0.2,0.5],[0.6,0.52]]}];
  paper={trail:[[0.2,0.3],[0.4,0.31],[0.6,0.3],[0.8,0.32]],mode:'desk',fade:1};
  const st={id:'write',k:0,cyc:0};
  const sk=computePose(st,1.2);
  ctx.clearRect(0,0,vw,vh);
  drawSet(); drawCarriedPaper(st,sk); drawCharacter(sk);
  capEl.textContent=''; headEl.classList.add('show');
}

function init(){
  canvas=document.getElementById('c');
  ctx=canvas.getContext('2d');
  capEl=document.getElementById('caption');
  progEl=document.getElementById('progress');
  headEl=document.getElementById('headline');
  hintEl=document.getElementById('hint');
  resize();
  window.addEventListener('resize',resize);
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){ renderStatic(); return; }
  const cam0=cameraFor({id:'write',k:0,cyc:0});
  view.cx=cam0.cx; view.cy=cam0.cy; view.z=Math.min(vw/cam0.viewW,vh/700);
  const loop=function(ms){
    frame(window.scrollY||window.pageYOffset||0,ms);
    window.requestAnimationFrame(loop);
  };
  window.requestAnimationFrame(loop);
}

if(typeof window!=='undefined'){
  window.__frame=frame;
  window.__timelineAt=timelineAt;
  window.__setViewport=function(w,h){ vw=w; vh=h; };
}
if(typeof document!=='undefined'&&document.getElementById) init();
</script>
